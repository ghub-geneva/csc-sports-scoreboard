<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LGU Cordova Sportsfest</title>
  <link rel="icon" type="image/x-icon" href="img/favicon.ico" />
  <link rel="stylesheet" href="css/style.css?v=20260903083305" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <img class="header-logo" src="img/cordova-logo.png" alt="Municipality of Cordova" />
      <div class="header-titles">
        <h1>LGU Cordova Sportsfest</h1>
      </div>
      <div class="header-partners">
        <img src="img/csc-theme.png" alt="126 Years" />
        <img src="img/csc-logo.png" alt="Civil Service Commission" />
        <img src="img/bagong-pilipinas.png" alt="Bagong Pilipinas" />
      </div>
    </div>
  </header>

  <main class="container" id="app">
    <!-- Rendered by js/app.js -->
  </main>

  <div class="footer">
    <div class="points-note">
      <strong>Scoring per event:</strong>
      <span class="pts-pill">1st = 10 pts</span>
      <span class="pts-pill">2nd = 7 pts</span>
      <span class="pts-pill">3rd = 5 pts</span>
      <span class="pts-pill">4th = 3 pts</span>
    </div>
    <div>Puso, Dangal, at Galing Para sa Bayan</div>
  </div>

  <script src="js/config.js?v=20260903083305"></script>
  <script src="js/data.js?v=20260903083305"></script>
  <script src="js/app.js?v=20260903083305"></script>
</body>
</html>
